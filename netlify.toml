[build]
  command = "chmod +x node_modules/.bin/vite && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"

# Disable automatic Next.js detection
# Use Vite instead of Next.js
[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ignore patterns for build
[context.production]
  ignore = ""
