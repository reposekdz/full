version: '3.8'

services:
  api:
    build: .
    container_name: garden-tvet-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      - db
    networks:
      - garden-tvet

  db:
    image: mysql:8.0
    container_name: garden-tvet-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: school_management
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - garden-tvet

volumes:
  db-data:

networks:
  garden-tvet:
    driver: bridge
