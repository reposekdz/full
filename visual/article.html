<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amakuru - Ibisobanuro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f7fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.3em; font-weight: bold; }
        .back-link { color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 5px; }
        .back-link:hover { background: rgba(255,255,255,0.3); }
        .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .article { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .article-image { width: 100%; height: 400px; object-fit: cover; }
        .article-content { padding: 40px; }
        .article-category { display: inline-block; background: #667eea; color: white; padding: 5px 15px; border-radius: 15px; font-size: 0.9em; margin-bottom: 15px; }
        .article-title { font-size: 2.5em; color: #333; margin-bottom: 20px; line-height: 1.3; }
        .article-meta { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 2px solid #eee; margin-bottom: 30px; color: #666; }
        .article-author { display: flex; align-items: center; gap: 10px; font-size: 1.1em; }
        .article-stats { display: flex; gap: 20px; font-size: 1.1em; }
        .article-body { font-size: 1.1em; line-height: 1.8; color: #444; }
        .article-body p { margin-bottom: 20px; }
        .loading { text-align: center; padding: 100px; color: #667eea; font-size: 1.2em; }
        .error { text-align: center; padding: 100px; color: #e74c3c; }
        .action-buttons { display: flex; gap: 15px; margin-top: 30px; padding-top: 30px; border-top: 2px solid #eee; }
        .btn { padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer; font-size: 1em; transition: 0.3s; }
        .btn-like { background: #e74c3c; color: white; }
        .btn-like:hover { background: #c0392b; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">📰 Amakuru Y'Ishuri</div>
        <a href="news.html" class="back-link">← Subira</a>
    </nav>

    <div class="container">
        <div id="articleContainer">
            <div class="loading">Gupakurura inkuru...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/news';
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        async function loadArticle() {
            if (!articleId) {
                showError('Nta nkuru yabonetse');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${articleId}`);
                const data = await response.json();
                
                if (data.success && data.article) {
                    displayArticle(data.article);
                    trackView(articleId);
                } else {
                    showError('Inkuru ntiyabonetse');
                }
            } catch (error) {
                showError('Ikosa mu gupakurura inkuru: ' + error.message);
            }
        }

        function displayArticle(article) {
            const container = document.getElementById('articleContainer');
            container.innerHTML = `
                <div class="article">
                    <img src="http://localhost:3000${article.image_url}" alt="${article.title}" class="article-image" onerror="this.style.display='none'">
                    <div class="article-content">
                        <span class="article-category">${article.category}</span>
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-meta">
                            <div class="article-author">
                                <span>👤</span>
                                <span>${article.author}</span>
                                <span>•</span>
                                <span>${new Date(article.date_published).toLocaleDateString('rw-RW')}</span>
                            </div>
                            <div class="article-stats">
                                <span>👁️ ${article.views || 0}</span>
                                <span>❤️ ${article.likes || 0}</span>
                            </div>
                        </div>
                        <div class="article-body">
                            ${article.content.split('\n').map(p => `<p>${p}</p>`).join('')}
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-like" onclick="likeArticle(${article.id})">❤️ Kunda</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('articleContainer').innerHTML = `<div class="error">${message}</div>`;
        }

        async function trackView(id) {
            try {
                await fetch(`${API_URL}/${id}/view`, { method: 'POST' });
            } catch (error) {
                console.error('Error tracking view:', error);
            }
        }

        async function likeArticle(id) {
            try {
                await fetch(`${API_URL}/${id}/like`, { method: 'POST' });
                alert('Murakoze gukunda iyi nkuru!');
                loadArticle();
            } catch (error) {
                alert('Ikosa ryabaye: ' + error.message);
            }
        }

        loadArticle();
    </script>
</body>
</html>
